# Réglages de la Tête NAM (lu au démarrage par le service tete-nam)
# Après une modification :  sudo systemctl restart tete-nam

# Carte son (nom ALSA, visible avec : cat /proc/asound/cards)
CARD=M4

# Fréquence d'échantillonnage : doit être celle des modèles (48 kHz en général)
RATE=48000

# Taille du buffer JACK : commencer à 256, puis essayer 128
PERIOD=256

# Nombre de périodes : 3 est plus sûr en USB, 2 donne moins de latence
NPERIODS=3

# Entrée guitare de la M4 (capture_1 = entrée 1 en façade)
INPUT=system:capture_1

# Sorties de la M4 vers l'ampli (playback_1 et 2 = sorties principales,
# réglées par le gros bouton MONITOR)
OUTPUTS="system:playback_1 system:playback_2"

# Modèle principal (obligatoire). Éviter les espaces dans le nom du fichier.
MODEL1=__HOME__/nam/modele1.nam

# Deuxième modèle, branché en série après le premier (laisser vide pour aucun)
MODEL2=

# Niveaux en dB (-20 à +20) appliqués à chaque modèle, avant et après
IN_DB=0
OUT_DB=0

# Qualité des modèles NAM A2, de 0.0 (le plus léger) à 1.0 (complet).
# Un modèle A2 contient plusieurs tailles du même son : ce réglage choisit
# celle qui tourne. On démarre au plus léger sur le Pi 3, puis on monte.
QUALITY=0.0
