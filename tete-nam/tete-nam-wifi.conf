# Wi-Fi de secours de la Tête NAM (lu par : tete-nam-wifi)
# Après une modification :  sudo tete-nam-wifi hotspot   (ou un redémarrage)

# auto    : au démarrage, la tête cherche un Wi-Fi connu (celui de la maison).
#           Si elle n'en trouve pas, elle crée son propre réseau (hotspot).
# hotspot : toujours son propre réseau, sans chercher (studio sans Wi-Fi).
# maison  : jamais de hotspot.
MODE=auto

# Temps laissé au Wi-Fi connu pour se connecter au démarrage, en secondes
ATTENTE=45

# Nom et mot de passe du réseau créé par la tête.
# Mot de passe : 8 caractères minimum. CHANGEZ-LE.
SSID=TeteNAM
MOT_DE_PASSE=tetenam2026

# Canal Wi-Fi 2,4 GHz : 1, 6 ou 11. Changer si un autre réseau gêne.
CANAL=6
